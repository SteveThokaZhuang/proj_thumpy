# E5: SoulX-Duplug 推理配置 (绝对路径, 用户提供的本地权重)
model_config:
  task: state_prediction

  glm_tokenizer_path: /share/workspace3/shared_models/SoulX-Duplug-0.6B/glm-4-voice-tokenizer
  model_name: /share/workspace3/shared_models/SoulX-Duplug-0.6B/Qwen3-0.6B-expand_vocab_v2
  llm_dim: 1024
  lm_vocab_size: 151936

  enable_lora: true
  lora_r: 32
  lora_alpha: 64

  init_ckpt_path_lora: /share/workspace3/shared_models/SoulX-Duplug-0.6B/SoulX-Duplug/SoulX-Duplug-0.6B-Bilingual.pth

  # 级联 ASR: 本地 SenseVoiceSmall (经 modelscope 缓存符号链接)
  enable_cascade_asr: true

infer_config:
  seed: 42
  device: cuda
  precision: bf16
  max_wait_num: 5
  max_mistake_num: 5

  input:
    chunk_size: 2560
    audio_back_size: 15360
    audio_ahead_size: 640
    sample_rate: 16000

  asr:
    model_name: sensevoice
    language: en
